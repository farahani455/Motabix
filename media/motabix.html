<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
               <link rel="stylesheet" href="{mediaUri}/codicon.css">
               <link href="{mediaUri}/hljs/vs2015.min.css" rel="stylesheet"/>
               <link rel="stylesheet" href="{mediaUri}/hljs/github-dark.min.css">
              <link href="{mediaUri}/motabix.css" rel="stylesheet"/>
              <link href="{mediaUri}/settings.css" rel="stylesheet"/>
          </head>
          <body>
              <div class="app-shell">
                  <header class="topbar">
                      <div class="topbar-title">Motabix</div>
                      <div class="topbar-actions">
                        <button id="clearHistory" class="icon-button" type="button" aria-label="Clear chat history" title="Clear history">
                            <span aria-hidden="true" class="codicon codicon-clear-all"></span>
                        </button>
                        <button id="settings" class="icon-button" type="button" aria-label="Open settings" title="Settings">
                            <span aria-hidden="true" class="codicon codicon-gear"></span>
                        </button>
                      </div>
                  </header>
                  <div id="settingsPanel" class="settings-panel hidden">
                    <div class="settings-header">
                        <button id="settingsBack" class="icon-button" type="button" title="Back to chat" aria-label="Back to chat">
                            <span class="codicon codicon-arrow-left" aria-hidden="true"></span>
                        </button>
                        <div class="settings-title">Settings</div>
                    </div>

                    <div class="settings-card">
                        <div class="settings-section-label">Provider</div>
                        <div class="settings-field">
                            <label for="settingsProvider">Backend</label>
                            <select id="settingsProvider">
                                <option value="ollama" selected>Local (Ollama)</option>
                                <option value="motabix-router">MotabixRouter</option>
                            </select>
                        </div>
                        <div id="ollamaSettings" class="settings-field-group">
                            <div class="settings-field">
                                <label for="ollamaBaseURL">Ollama address</label>
                                <input id="ollamaBaseURL" type="text" value="http://127.0.0.1:11434" />
                            </div>
                        </div>
                        <div id="routerSettings" class="settings-field-group hidden">
                            <div class="settings-field">
                                <label for="routerBaseURL">MotabixRouter address</label>
                                <input id="routerBaseURL" type="text" value="http://127.0.0.1:8787" />
                            </div>
                            <div class="settings-field">
                                <label for="routerApiKey">API Key</label>
                                <input id="routerApiKey" type="password" value="" placeholder="Required for MotabixRouter" />
                            </div>
                        </div>
                    </div>

                    <div class="settings-card">
                        <div class="settings-section-label">Agent</div>
                        <div class="settings-field">
                            <label for="runCommandPermission">run_command permission</label>
                            <select id="runCommandPermission">
                                <option value="ask" selected>With approval</option>
                                <option value="allow">Without approval</option>
                            </select>
                        </div>
                        <div class="settings-field">
                            <label for="pathScope">read_file / edit_file path scope</label>
                            <select id="pathScope">
                                <option value="workspace" selected>Workspace only</option>
                                <option value="unrestricted">Any path</option>
                            </select>
                        </div>
                        <div class="settings-field">
                            <label for="runCommandCwd">run_command working directory</label>
                            <input id="runCommandCwd" type="text" value="" placeholder="Leave empty for workspace root" />
                        </div>
                    </div>

                    <div class="settings-actions">
                        <div class="settings-action-row">
                            <button id="testConnection" class="settings-secondary-button" type="button">Test connection</button>
                            <button id="saveSettings" class="settings-save-button" type="button">Save</button>
                        </div>
                        <p id="settingsStatus" class="settings-status"></p>
                    </div>
                  </div>

                  <div class="messages" id="messages"></div>

                <div class="composer">
                    <div class="content-attachments">
                        <button id="addContentBtn" class="add-content-btn" type="button" title="Add content">
                            <span class="codicon codicon-add"></span>
                            <span>Add content</span>
                        </button>
                        <div class="attached-content" id="attachedContent">
                            <span class="content-chip" data-content="active-document">
                                <span class="codicon codicon-file"></span>
                                <span>Active Document</span>
                                <button class="remove-chip" type="button" aria-label="Remove">&times;</button>
                            </span>
                        </div>
                                        <!-- Add Content Dropdown -->
                        <div id="addContentDropdown" class="add-content-dropdown hidden">
                            <div class="content-option" data-content="active-document">
                                <span class="codicon codicon-file"></span>Active Document
                            </div>
                            <div class="content-option" data-content="browse-project">
                                <span class="codicon codicon-folder-opened"></span>Browse from Project
                            </div>
                        </div>
                    </div>
                    <div id="textInput" contenteditable="true" class="chat-input" placeholder="Write something..."></div>
                    <div class="composer-actions">
                        <div class="selectors-group">
                        <div class="model-selector-wrapper">
                            <button id="model" class="model-button" type="button" title="Select model">
                                <span class="codicon codicon-sparkle"></span>
                                <span class="model-label" id="model-label" data-model="">No models</span>
                                <span class="codicon codicon-chevron-down"></span>
                            </button>
                            <div id="modelDropdown" class="model-dropdown hidden"></div>
                        </div>
                        <div class="agent-selector-wrapper">
                            <button id="setAgent" class="agent-button" type="button" title="Mode">
                                <span class="codicon codicon-comment" id="agent-icon" aria-hidden="true"></span>
                                <span class="agent-label" id="agent-label" data-agent="Ask">Ask</span>
                                <span class="codicon codicon-chevron-down"></span>
                            </button>
                            <div id="agentDropdown" class="agent-dropdown hidden">
                                <div class="agent-option" data-agent="Ask">
                                    <span class="codicon codicon-comment" aria-hidden="true"></span>Ask
                                </div>
                                <div class="agent-option" data-agent="Edit">
                                    <span class="codicon codicon-edit" aria-hidden="true"></span>Edit
                                </div>
                                <div class="agent-option" data-agent="Edit Automatically">
                                    <span class="codicon codicon-run-all" aria-hidden="true"></span>Edit Automatically
                                </div>
                            </div>
                        </div>
                        </div>
                        <button id="stopButton" class="stop-button hidden" type="button" aria-label="Stop" title="Stop" disabled>
                            <span aria-hidden="true" class="codicon codicon-debug-stop"></span>
                        </button>
                        <button id="sendButton" class="send-button" type="button" aria-label="Send message" title="Send">
                            <span aria-hidden="true" class="codicon codicon-send"></span>
                        </button>
                    </div>
                </div>
                

              </div>
                <script src="{mediaUri}/hljs/highlight.min.js" ></script>

              <!-- Core Languages -->
                <script src="{mediaUri}/hljs/javascript.min.js"></script>
                <script src="{mediaUri}/hljs/typescript.min.js"></script>
                <script src="{mediaUri}/hljs/python.min.js"></script>
                <script src="{mediaUri}/hljs/java.min.js"></script>
                <script src="{mediaUri}/hljs/csharp.min.js"></script>
                <script src="{mediaUri}/hljs/cpp.min.js"></script>
                <script src="{mediaUri}/hljs/c.min.js"></script>

                <!-- Web -->
                <script src="{mediaUri}/hljs/css.min.js"></script>
                <script src="{mediaUri}/hljs/xml.min.js"></script>
                <script src="{mediaUri}/hljs/json.min.js"></script>

                <!-- Backend -->
                <script src="{mediaUri}/hljs/php.min.js"></script>
                <script src="{mediaUri}/hljs/ruby.min.js"></script>
                <script src="{mediaUri}/hljs/go.min.js"></script>
                <script src="{mediaUri}/hljs/rust.min.js"></script>

                <!-- Scripting & Shell -->
                <script src="{mediaUri}/hljs/bash.min.js"></script>
                <script src="{mediaUri}/hljs/shell.min.js"></script>
                <script src="{mediaUri}/hljs/powershell.min.js"></script>

                <!-- Database -->
                <script src="{mediaUri}/hljs/sql.min.js"></script>

                

                <!-- Config & Markup -->
                <script src="{mediaUri}/hljs/yaml.min.js"></script>
                <script src="{mediaUri}/hljs/markdown.min.js"></script>
                <script src="{mediaUri}/hljs/dockerfile.min.js"></script>

                <!-- Other -->
                <script src="{mediaUri}/hljs/swift.min.js"></script>
                <script src="{mediaUri}/hljs/kotlin.min.js"></script>
                <script src="{mediaUri}/hljs/dart.min.js"></script>

              <script src="{mediaUri}/motabix.js" ></script>
          </body>
          </html>
